<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ панель — State Forms</title>
    <link rel="icon" type="image/png" href="favicon.png?v=1">
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
    <nav class="nav">
        <div class="nav__inner">
        <a href="/" class="nav__logo">
            <img src="../src/logo.png" alt="State Forms" class="nav__logo-img">
            <span class="nav__logo-text">State Forms</span>
        </a>
        <div class="nav__links">
            <a href="/">Главная</a>
        </div>
        <div class="nav__user" id="nav-user" style="display:none">
            <button class="nav__btn nav__btn--discord" id="auth-btn" type="button">
            <span id="auth-label">Загрузка...</span>
            </button>
            <div class="nav__dropdown" id="nav-dropdown">
            <div class="nav__dropdown-header">
                <span class="nav__dropdown-role" id="dropdown-role">Пользователь</span>
            </div>
            <a href="/department" class="nav__dropdown-item" id="btn-department" style="display:none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 21h18M3 7v14M21 7v14M6 11h.01M6 15h.01M6 19h.01M10 11h.01M10 15h.01M10 19h.01M14 11h.01M14 15h.01M14 19h.01M18 11h.01M18 15h.01M18 19h.01M9 7a3 3 0 116 0v0a3 3 0 01-6 0z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Открыть ведомство
            </a>
            <a href="/admin" class="nav__dropdown-item" id="btn-admin" style="display:none">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Админ панель
            </a>
            <div class="nav__dropdown-divider"></div>
            <a href="/auth/logout" class="nav__dropdown-item nav__dropdown-item--logout">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                Выйти
            </a>
            </div>
        </div>
        <a href="/auth/discord" id="auth-btn-guest" class="nav__btn nav__btn--discord" style="display:none">
            <svg width="18" height="14" viewBox="0 0 24 18" fill="none"><path d="M19.7 1.5A19.8 19.8 0 0014.8 0a.1.1 0 00-.1.04c-.2.4-.4.9-.6 1.2-1.8-.3-3.7-.3-5.5 0-.2-.4-.4-.9-.6-1.2a.1.1 0 00-.1-.04A19.7 19.7 0 001.5 1.5a.1.1 0 000 .03C-.5 6 .0 10.5.4 15a.1.1 0 000 .06c2 1.5 4 2.4 6 3a.1.1 0 00.1-.03c.5-.6.9-1.3 1.2-2a.1.1 0 00-.1-.1c-.7-.2-1.3-.5-1.9-.9a.1.1 0 010-.1c.1-.1.3-.2.4-.3a.1.1 0 01.1 0c3.9 1.8 8.2 1.8 12.1 0a.1.1 0 01.1 0l.4.3a.1.1 0 010 .1c-.6.4-1.2.7-1.9.9a.1.1 0 00-.1.1c.4.7.8 1.3 1.2 2a.1.1 0 00.1.03c2-.6 4-1.5 6-3a.1.1 0 000-.06c.6-5.2-1-9.7-3.8-13.7a.1.1 0 000-.03zM8 12.6c-1.2 0-2.2-1.1-2.2-2.4 0-1.3 1-2.4 2.2-2.4 1.2 0 2.2 1.1 2.2 2.4 0 1.3-1 2.4-2.2 2.4zm8 0c-1.2 0-2.2-1.1-2.2-2.4 0-1.3 1-2.4 2.2-2.4 1.2 0 2.2 1.1 2.2 2.4 0 1.3-.9 2.4-2.2 2.4z" fill="white"/></svg>
            Войти
        </a>
        </div>
    </nav>

    <main class="admin-page">
        <div class="admin-page__inner">
        <h1 class="admin-page__title">Админ панель</h1>

        <div class="admin-section">
            <h2 class="admin-section__title">Назначить ведомство по Discord ID</h2>
            <div class="admin-assign">
            <input type="text" class="admin-input" id="assign-discord-id" placeholder="Discord ID">
            <select class="admin-select" id="assign-dept-select">
                <option value="">-- Без ведомства --</option>
            </select>
            <button class="btn btn--primary" onclick="assignDept()">Назначить</button>
            </div>
        </div>

        <div class="admin-section">
            <h2 class="admin-section__title">Пользователи</h2>
            <div class="admin-search">
            <input type="text" class="admin-input" id="search-discord-id" placeholder="Поиск по Discord ID..." oninput="filterUsers()">
            </div>
            <div class="admin-table-wrap">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>Пользователь</th>
                    <th>Discord ID</th>
                    <th>Роль</th>
                    <th>Ведомство</th>
                </tr>
                </thead>
                <tbody id="users-body"></tbody>
            </table>
            </div>
        </div>
        </div>
    </main>

    <script>
    let departments = [];
    let currentDiscordId = '';
    let allUsers = [];

    async function init() {
        const res = await fetch('/api/me');
        const data = await res.json();
        if (!data.loggedIn || data.user.role !== 'developer') {
            window.location.href = '/';
            return;
        }
        currentDiscordId = data.user.id;

        document.getElementById('nav-user').style.display = 'block';
        const authBtn = document.getElementById('auth-btn');
        const avatarUrl = data.user.avatar
            ? `https://cdn.discordapp.com/avatars/${data.user.id}/${data.user.avatar}.png?size=64`
            : `https://cdn.discordapp.com/embed/avatars/${parseInt(data.user.discriminator || 0) % 5}.png`;
        authBtn.innerHTML = `<img src="${avatarUrl}" width="24" height="24" style="border-radius:50%"><span>${data.user.username}</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
        document.getElementById('dropdown-role').textContent = 'Developer';
        document.getElementById('btn-admin').style.display = 'flex';

        authBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.getElementById('nav-dropdown').classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            const dd = document.getElementById('nav-dropdown');
            if (!dd.contains(e.target) && e.target !== authBtn) dd.classList.remove('open');
        });

        const deptsRes = await fetch('/api/departments');
        departments = await deptsRes.json();

        const select = document.getElementById('assign-dept-select');
        departments.forEach(d => {
            select.innerHTML += `<option value="${d.id}">${d.short_name} — ${d.name}</option>`;
        });

        await loadUsers();
    }

    async function loadUsers() {
        const res = await fetch('/api/users');
        allUsers = await res.json();
        renderUsers(allUsers);
    }

    function filterUsers() {
        const query = document.getElementById('search-discord-id').value.trim();
        if (!query) {
            renderUsers(allUsers);
        } else {
            renderUsers(allUsers.filter(u => u.discord_id.includes(query)));
        }
    }

    function renderUsers(users) {
        const tbody = document.getElementById('users-body');
        tbody.innerHTML = users.map(u => `
            <tr>
            <td>
                <div class="admin-user">
                <img class="admin-user__avatar" src="${u.avatar ? `https://cdn.discordapp.com/avatars/${u.discord_id}/${u.avatar}.png?size=32` : `https://cdn.discordapp.com/embed/avatars/0.png`}" alt="">
                <span>${u.username}</span>
                </div>
            </td>
            <td class="admin-mono admin-copy" onclick="copyId(this, '${u.discord_id}')" title="Нажми чтобы скопировать">${u.discord_id}</td>
            <td>
                <select class="admin-select admin-select--sm" onchange="changeRole(${u.id}, this.value)" ${u.discord_id === currentDiscordId ? 'disabled' : ''}>
                <option value="user" ${u.role === 'user' ? 'selected' : ''}>user</option>
                <option value="leader" ${u.role === 'leader' ? 'selected' : ''}>leader</option>
                <option value="developer" ${u.role === 'developer' ? 'selected' : ''}>developer</option>
                </select>
            </td>
            <td>
                <select class="admin-select admin-select--sm" onchange="changeDept(${u.id}, this.value)" ${u.role !== 'leader' ? 'disabled' : ''}>
                <option value="">— нет —</option>
                ${departments.map(d => `<option value="${d.id}" ${u.department_id == d.id ? 'selected' : ''}>${d.short_name}</option>`).join('')}
                </select>
            </td>
            </tr>
        `).join('');
    }

    async function copyId(el, id) {
        await navigator.clipboard.writeText(id);
        const orig = el.textContent;
        el.textContent = 'Скопировано!';
        el.classList.add('admin-copy--done');
        setTimeout(() => { el.textContent = orig; el.classList.remove('admin-copy--done'); }, 1000);
    }

    async function changeRole(userId, role) {
        await fetch(`/api/users/${userId}/role`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role })
        });
        await loadUsers();
    }

    async function changeDept(userId, deptId) {
        await fetch(`/api/users/${userId}/department`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ department_id: deptId || null })
        });
        await loadUsers();
    }

    async function assignDept() {
        const discordId = document.getElementById('assign-discord-id').value.trim();
        const deptId = document.getElementById('assign-dept-select').value;
        if (!discordId) return alert('Введите Discord ID');

        const res = await fetch('/api/users');
        const users = await res.json();
        const user = users.find(u => u.discord_id === discordId);
        if (!user) return alert('Пользователь не найден');

        await changeDept(user.id, deptId);
        document.getElementById('assign-discord-id').value = '';
        alert('Ведомство назначено');
    }

    init();
    </script>
</body>
</html>
