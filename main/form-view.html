<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Форма — State Forms</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/base.css?v=6">
    <link rel="stylesheet" href="/forms.css?v=7">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e4e9f2 100%); min-height: 100vh; overflow-x: hidden; position: relative; }
        .floating-circles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .circle { position: absolute; border-radius: 50%; opacity: 0.15; animation: float linear infinite; }
        .circle--1 { width: 300px; height: 300px; background: var(--blurple); top: 10%; left: -5%; animation-duration: 20s; }
        .circle--2 { width: 200px; height: 200px; background: var(--mint); top: 60%; right: -3%; animation-duration: 25s; animation-delay: -5s; }
        .circle--3 { width: 150px; height: 150px; background: var(--blurple); bottom: 10%; left: 20%; animation-duration: 18s; animation-delay: -8s; }
        .circle--4 { width: 250px; height: 250px; background: var(--mint); top: 30%; right: 15%; animation-duration: 22s; animation-delay: -12s; }
        .circle--5 { width: 180px; height: 180px; background: var(--blurple); top: 80%; left: 60%; animation-duration: 28s; animation-delay: -3s; }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            25% { transform: translateY(-30px) rotate(5deg) scale(1.05); }
            50% { transform: translateY(20px) rotate(-3deg) scale(0.95); }
            75% { transform: translateY(-15px) rotate(2deg) scale(1.02); }
        }
        .form-view { max-width: 640px; margin: 0 auto; padding: 120px 24px 80px; position: relative; z-index: 1; }
        .form-view__header { margin-bottom: 32px; animation: slideDown 0.5s ease; }
        .form-view__title { font-size: 28px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
        .form-view__dept { font-size: 14px; font-weight: 600; }
        .form-view__card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 16px; padding: 32px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); animation: slideUp 0.6s ease 0.1s both; }
        .form-view__fields { display: flex; flex-direction: column; gap: 24px; }
        .form-field { display: flex; flex-direction: column; gap: 8px; animation: fadeIn 0.4s ease both; }
        .form-field:nth-child(1) { animation-delay: 0.2s; }
        .form-field:nth-child(2) { animation-delay: 0.3s; }
        .form-field:nth-child(3) { animation-delay: 0.4s; }
        .form-field:nth-child(4) { animation-delay: 0.5s; }
        .form-field:nth-child(5) { animation-delay: 0.6s; }
        .form-field:nth-child(6) { animation-delay: 0.7s; }
        .form-field:nth-child(7) { animation-delay: 0.8s; }
        .form-field:nth-child(8) { animation-delay: 0.9s; }
        .form-field:nth-child(9) { animation-delay: 1.0s; }
        .form-field:nth-child(10) { animation-delay: 1.1s; }
        .form-field__label { font-size: 15px; font-weight: 600; }
        .form-field__required { color: #E74C3C; }
        .form-field input, .form-field textarea, .form-field select {
            padding: 12px 16px; border: 1px solid rgba(0,0,0,0.1); border-radius: 10px;
            font-size: 15px; background: var(--paper); font-family: inherit;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-field input:focus, .form-field textarea:focus, .form-field select:focus {
            outline: none; border-color: var(--blurple); background: var(--white);
            box-shadow: 0 0 0 3px rgba(88,101,242,0.15);
        }
        .form-field textarea { min-height: 120px; resize: vertical; }
        .form-view__submit { margin-top: 32px; animation: fadeIn 0.5s ease 0.8s both; }
        .form-view__success { text-align: center; padding: 60px 0; animation: scaleIn 0.5s ease; }
        .form-view__success svg { margin-bottom: 16px; }
        .form-view__success h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .form-view__success p { color: var(--slate); }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    </style>
</head>
<body>
    <div class="floating-circles">
        <div class="circle circle--1"></div>
        <div class="circle circle--2"></div>
        <div class="circle circle--3"></div>
        <div class="circle circle--4"></div>
        <div class="circle circle--5"></div>
    </div>
    <nav class="nav">
        <div class="nav__inner">
            <a href="/" class="nav__logo">
                <img src="/src/logo.png" alt="State Forms" class="nav__logo-img">
                <span class="nav__logo-text">State Forms</span>
            </a>
        </div>
    </nav>

    <main class="form-view" id="form-content">
        <div style="text-align:center;padding:80px 0;color:var(--slate)">Загрузка...</div>
    </main>

    <script>
    async function init() {
        const path = window.location.pathname;
        const parts = path.split('/').filter(Boolean);
        if (parts.length < 2) { window.location.href = '/'; return; }
        const deptSlug = parts[0];
        const formSlug = parts[1];

        const res = await fetch(`/api/forms/view/${deptSlug}/${formSlug}`);
        if (!res.ok) {
            document.getElementById('form-content').innerHTML = '<div style="text-align:center;padding:80px 0"><h2>Форма не найдена</h2><p><a href="/">Вернуться на главную</a></p></div>';
            return;
        }
        const form = await res.json();
        document.title = `${form.name} — State Forms`;

        const container = document.getElementById('form-content');
        container.innerHTML = `
            <div class="form-view__header">
                <h1 class="form-view__title">${form.name}</h1>
                <span class="form-view__dept" style="color: ${form.department_color}">${form.department_short}</span>
            </div>
            <div class="form-view__card">
                <form id="form-response" onsubmit="submitForm(event, ${form.id})">
                    <div class="form-view__fields">
                        ${form.fields.map((f, i) => `
                            <div class="form-field">
                                <label class="form-field__label">${f.label} ${f.required ? '<span class="form-field__required">*</span>' : ''}</label>
                                ${renderFieldInput(f, i)}
                            </div>
                        `).join('')}
                    </div>
                    <div class="form-view__submit">
                        <button type="submit" class="btn btn--primary btn--large" style="width:100%">Отправить</button>
                    </div>
                </form>
            </div>
        `;
    }

    function renderFieldInput(f, i) {
        switch (f.type) {
            case 'short_text':
                return `<input type="text" name="field_${i}" ${f.required ? 'required' : ''} placeholder="Введите ответ">`;
            case 'long_text':
                return `<textarea name="field_${i}" ${f.required ? 'required' : ''} placeholder="Введите ответ"></textarea>`;
            case 'select':
                const opts = (f.options || []).map(o => `<option value="${o}">${o}</option>`).join('');
                return `<select name="field_${i}" ${f.required ? 'required' : ''}><option value="">Выберите...</option>${opts}</select>`;
            case 'date':
                return `<input type="date" name="field_${i}" ${f.required ? 'required' : ''} max="9999-12-31" oninput="if(this.value.length>10)this.value=this.value.slice(0,10)">`;
            case 'datetime':
                return `<input type="datetime-local" name="field_${i}" ${f.required ? 'required' : ''} max="9999-12-31T23:59" oninput="if(this.value.length>16)this.value=this.value.slice(0,16)">`;
            default:
                return `<input type="text" name="field_${i}">`;
        }
    }

    async function submitForm(e, formId) {
        e.preventDefault();
        const form = e.target;
        const formData = new FormData(form);
        const answers = {};
        for (const [key, value] of formData.entries()) {
            answers[key] = value;
        }
        const res = await fetch(`/api/forms/${formId}/submit`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ answers })
        });
        const data = await res.json();
        if (data.success) {
            document.getElementById('form-content').innerHTML = `
                <div class="form-view__success">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none"><path d="M22 11.08V12a10 10 0 11-5.93-9.14" stroke="var(--mint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 4L12 14.01l-3-3" stroke="var(--mint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <h2>Ответ отправлен</h2>
                    <p>Спасибо за заполнение формы!</p>
                </div>
            `;
        } else {
            alert(data.error || 'Ошибка отправки');
        }
    }

    init();
    </script>
</body>
</html>
