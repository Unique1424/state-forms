server {
    listen 80;
    listen 443 ssl http2;
    server_name state-forms.site www.state-forms.site;

    # Cloudflare Origin Certificate
    ssl_certificate     /etc/nginx/ssl/state-forms.site.pem;
    ssl_certificate_key /etc/nginx/ssl/state-forms.site-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # Доверяем только Cloudflare IP (чтобы нельзя было обойти CDN)
    # https://www.cloudflare.com/ips/
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    real_ip_header CF-Connecting-IP;

    # Корневая директория с сайтом
    root /var/www/state-forms/main;
    index index.html;

    # Основной location
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Кеширование статики
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Безопасность
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 256;

    # Логи
    access_log /var/log/nginx/state-forms.access.log;
    error_log  /var/log/nginx/state-forms.error.log;
}
